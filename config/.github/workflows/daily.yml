name: Génération quotidienne du digest

on:
  schedule:
    # Tous les jours à 7h00 heure de Paris (6h UTC en hiver, 5h UTC en été).
    # GitHub Actions ne connaît que l'UTC : ajuster si besoin.
    - cron: "0 6 * * *"
  workflow_dispatch: {}  # permet de lancer manuellement depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer la page du jour
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scraper.py

      - name: Préparer la page
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
